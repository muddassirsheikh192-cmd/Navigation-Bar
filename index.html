<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #111111;
            padding: 8px 20px;
            border-radius: 50px;
            width: 80%;
        }

        .nav-logo {
            background-color: #ffffff;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;

        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            text-decoration: none;
            color: #b3b3b3;
            font-size: 16px;

        }

        .nav-links a:hover {
            color: #ffffff;
        }

        .nav-button a {
            background-color: #ffffff;
            color: #1a1a1a;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 30px;
            display: inline-block;

        }

        .nav-button a:hover {
            background-color: #e6e6e6;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="nav-logo">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
                <!-- Planet Body -->
                <circle cx="50" cy="50" r="22" fill="#000000" />

                <!-- Planet Ring -->
                <ellipse cx="50" cy="50" rx="38" ry="12" fill="none" stroke="#000000" stroke-width="5"
                    transform="rotate(-25 50 50)" />
            </svg>
        </div>
        <ul class="nav-links">
            <li><a href="#">work</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">playground</a></li>
            <li><a href="#">Resources</a></li>
        </ul>
        <div class="nav-button">
            <a href="mailto:ihyaet@gmail.com">ihyaet@gmail.com</a>

        </div>
    </nav>
</body>

</html>
